name: Bootstrap canonical campus data

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/canonical-campus-data
    paths:
      - .github/workflows/bootstrap-canonical-campus-data.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-canonical-campus-data
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Gapwise Data migration branch
        uses: actions/checkout@v4
        with:
          ref: refactor/canonical-campus-data
          fetch-depth: 0

      - name: Check out current Gapwise campus source
        uses: actions/checkout@v4
        with:
          repository: andrewmuratov/gapwise
          ref: main
          path: .upstream-gapwise
          fetch-depth: 1

      - name: Copy the campus dataset byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/utm
          mkdir -p data/utm public/data
          cp -a .upstream-gapwise/src/data/utm/. data/utm/
          cp .upstream-gapwise/public/data/utm-campus-v1.json public/data/utm-campus-v1.json

          upstream_sha="$(git -C .upstream-gapwise rev-parse HEAD)"
          cat > data/utm-source.json <<EOF
          {
            "schemaVersion": 1,
            "canonicalRepository": "andrewmuratov/gapwise-data",
            "canonicalPath": "data/utm",
            "bootstrappedFrom": {
              "repository": "andrewmuratov/gapwise",
              "ref": "main",
              "commit": "${upstream_sha}",
              "path": "src/data/utm"
            },
            "consumerContract": {
              "runtimeFetchRequired": false,
              "coreMirrorPath": "src/data/utm",
              "syncMode": "vendored-build-time-snapshot"
            }
          }
          EOF

          find data/utm -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  data/utm/#  #' \
            > data/utm/SHA256SUMS

      - name: Commit canonical bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/utm data/utm-source.json public/data/utm-campus-v1.json
          if git diff --cached --quiet; then
            echo "Canonical campus data is already bootstrapped."
            exit 0
          fi
          git commit -m "data: import canonical UTM campus dataset"
          git push origin HEAD:refactor/canonical-campus-data
